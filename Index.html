<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaccaHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <header class="primary-color">
        <div class="wrap">
            <div class="logo">
                <a href="#start">BaccaHub</a>
            </div>
            <div class="head-buttons">
                <div class="lang">
                    <span class="ar">العربية</span>
                    <span class="en">English</span>
                </div>
                <div class="auth">
                    <button class="log-in prim-btn lng" data-lng="login"></button>
                    <button class="sign-up sec-btn lng" data-lng="signup1"></button>
                </div>
            </div>
        </div>
    </header>
    <div class="body primary-color">
        <div class="wrap">
            <div class="left">
                <p class="first lng" data-lng="firstPara"></p>
                <h1>
                    <span class="text-head lng"><span class="lng" data-lng="header1"></span> <span class="lng" data-lng="header2"></span>
                        <span style="display:block;" class="lng" data-lng="header3"></span></span>
                </h1>
                <p class="explanation lng" data-lng="explanation"></p>
                <div class="body-buttons">
                    <button class="log-in prim-btn lng" data-lng="login"></button>
                    <button class="sign-up sec-btn lng" data-lng="signup2"></button>
                </div>

            </div>
            <div class="right-wrap">
                <img src="images/py.svg" alt="Python" class="python-logo">
                <div class="right">
                    <div class="head-code">Greetings.py</div>
                    <pre class="body-code">
                <code>
        <span class="func">if</span> <span class="func">!</span>firstTime:
                <span class="print">print</span><span class="parameters">(</span><span class="string">"Welcome Back!"</span><span class="parameters">)</span>
        <span class="func">else</span>:
                <span class="print">print</span><span class="parameters">(</span><span class="string">"Hello, Stranger!"</span><span class="parameters">)</span>
                </code>
            </pre>
                </div>
                <div class="how-it-works"></div>
            </div>
        </div>
    </div>
    <footer class="primary-color">

    </footer>
</body>
<script type="module" src="js/index/index.js"></script>
</html>
