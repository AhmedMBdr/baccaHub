<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../css/panel.css">
  <link rel="stylesheet" href="../../css/style.css">
  <title>Profile</title>
</head>

<body class="panel">
  <script>if (location.protocol === "file:") document.addEventListener("DOMContentLoaded", function () { document.body.insertAdjacentHTML("afterbegin", '<div style="background:#f2b33d;color:#000;padding:12px;text-align:center;font-weight:600">Open this page through a local server (VS Code Live Server, or: python -m http.server), not by double-clicking the file.</div>') })</script>
  <header>
    <div class="wrap">
      <div class="logo"><a href="../../Index.html">BaccaHub</a></div>
      <div class="head-buttons">
        <div class="lang"><span class="en">English</span><span class="ar">العربية</span></div><button class="btn lng"
          data-lng="logout" id="logout" type="button"></button>
      </div>
    </div>
  </header>
  <main class="page">
    <div>
      <h1 class="lng" data-lng="profile"></h1>
    </div>
    <div class="grid2">
      <section class="card" aria-labelledby="acc">
        <h2 id="acc" class="lng" data-lng="account"></h2>
        <div id="account">
          <div class="skel"></div>
        </div>
      </section>
      <section class="card" aria-labelledby="cf">
        <h2 id="cf" class="lng" data-lng="cfTitle"></h2>
        <div id="codeforces">
          <div class="skel"></div>
        </div>
      </section>
    </div>
    <section class="card">
      <h2 class="lng" data-lng="stats"></h2>
      <p class="lead lng" data-lng="statsTxt"></p>
      <div><!-- TODO: point to Member 3's Quiz History page once it exists --><a href="../quizzes/history.html"
          class="lng" data-lng="openStats"></a></div>
    </section>
  </main>
  <script type="module" src="../../js/profile/profile.js"></script>
</body>

</html>
